<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Clube Bistek Ads</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tablet.css') }}">
</head>
<body>
    <div id="orientation-lock">
        <span class="material-icons" style="font-size: 64px; color: #00b3b8; margin-bottom: 20px; animation: rotate-icon 2s infinite">screen_rotation</span>
        <h2>Gire seu celular</h2>
    </div>

    <div id="app-container">
        <canvas id="overlay-canvas"></canvas>

        <header>
            <div class="logo"><h1><span class="clube-highlight">Clube</span> Bistek</h1></div>
            <div class="user-info" id="user-display">Visitante</div>
        </header>

        <aside class="cart-panel">
            <div class="cart-header"><span class="material-icons">shopping_cart</span> &nbsp; Carrinho</div>
            <div class="cart-items" id="cart-container"><div style="text-align:center; padding:20px; color:#999">Vazio</div></div>
            <div class="cart-total" id="total-price">R$ 0,00</div>
        </aside>

        <main class="ads-stage">
            <img src="https://img.freepik.com/fotos-gratis/variedade-de-deliciosos-produtos-lacteos_23-2148995052.jpg" class="ad-banner-img">
            <div class="ad-overlay">
                <h1 class="ad-title animate-entry">Festival de Ofertas</h1>
                <p class="ad-desc animate-entry">Aproveite os descontos exclusivos de hoje.</p>
            </div>
        </main>

        <aside class="hud-panel">
            <div class="context-card"><small>LOCALIZAÇÃO</small><h2 id="location-name">--</h2></div>
            <div class="map-widget"><canvas id="map-canvas" class="map-cvs"></canvas></div>
            <div class="offer-box"><h3><span class="material-icons" style="font-size:12px">star</span> Destaque</h3><p id="offer-text">Buscando...</p></div>
        </aside>

        <footer>
            <div style="display:flex; align-items:center; gap:5px"><span class="material-icons" style="font-size:14px; color:#0f0">wifi</span><span>Online</span></div>
            <div><span id="footer-type"></span><span id="footer-cpf"></span></div>
            <span id="clock-display">00:00</span>
        </footer>

        <div id="login-overlay">
            <div class="login-box">
                <h2 style="color:#333; margin-bottom:20px;">Iniciar Compras</h2>
                <input type="text" id="cpf-input" placeholder="Digite seu CPF">
                <button class="btn-primary" onclick="doLogin()">ACESSAR</button>
                <p id="login-error" class="error-msg">CPF não encontrado</p>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/tablet.js') }}"></script>
</body>
</html>
