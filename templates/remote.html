<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Controle Master</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/remote.css') }}">

    <style>
        /* Botões de Estilo Cicláveis */
        .style-controls {
            display: flex; gap: 10px; margin-bottom: 10px;
        }
        .cycle-btn {
            flex: 1;
            background: #333;
            color: white;
            border: 1px solid #444;
            padding: 15px;
            border-radius: 12px;
            font-weight: bold;
            display: flex; flex-direction: column; align-items: center; gap: 5px;
            font-size: 12px;
        }
        .cycle-btn:active { background: #444; transform: scale(0.98); }
        .cycle-btn span { font-size: 24px; }

        .control-footer { padding-bottom: 30px; }
    </style>
</head>
<body>

    <div id="control-mode">
        <header>
            <span style="font-weight:bold; color:#888">CONTROLE REMOTO</span>
            <div id="statusLed" class="status-led"></div>
        </header>

        <main class="d-pad-container">
            <div class="d-pad-grid">
                <div></div><div class="d-btn" data-key="UP"><span class="material-icons">arrow_upward</span></div><div></div>
                <div class="d-btn" data-key="LEFT"><span class="material-icons">arrow_back</span></div>
                <div class="center-decor">MOVE</div>
                <div class="d-btn" data-key="RIGHT"><span class="material-icons">arrow_forward</span></div>
                <div></div><div class="d-btn" data-key="DOWN"><span class="material-icons">arrow_downward</span></div><div></div>
            </div>
        </main>

        <footer class="control-footer">
            <button class="btn-action btn-scan" onclick="triggerScan()">
                <span class="material-icons">qr_code_scanner</span> ESCANEAR
            </button>

            <div class="style-controls">
                <button class="cycle-btn" onclick="cycleBg()">
                    <span class="material-icons">wallpaper</span>
                    Mudar Fundo
                </button>
                <button class="cycle-btn" onclick="cycleTheme()">
                    <span class="material-icons">palette</span>
                    Mudar Tema
                </button>
            </div>

            <div class="action-row">
                <button class="btn-action btn-pen" onclick="toggleDrawingMode(true)">
                    <span class="material-icons">edit</span> CANETA
                </button>
                <button class="btn-action btn-reset" onclick="triggerReset()">
                    <span class="material-icons">restart_alt</span> RESET
                </button>
            </div>
        </footer>
    </div>

    <div id="drawing-mode">
        <div class="draw-viewport" id="viewport">
            <div class="transform-layer" id="layer">
                <iframe src="/" class="mirror-frame" id="mirrorIframe"></iframe>
                <canvas id="canvas" class="draw-canvas" width="1280" height="800"></canvas>
            </div>
        </div>
        <div class="draw-toolbar">
            <button class="tool-btn" onclick="toggleDrawingMode(false)"><span class="material-icons">arrow_back</span></button>
            <div id="color-picker-wrapper"><input type="color" id="color-input" value="#ff0000"></div>
            <button class="tool-btn active" id="btn-draw" onclick="setTool('draw')"><span class="material-icons">brush</span></button>
            <button class="tool-btn" id="btn-move" onclick="setTool('move')"><span class="material-icons">pan_tool</span></button>
            <button class="tool-btn danger" onclick="clearDrawings()"><span class="material-icons">delete_forever</span></button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/remote.js') }}"></script>
    <script>
        function cycleBg() {
            socket.emit('action_cycle_bg');
            if(navigator.vibrate) navigator.vibrate(30);
        }
        function cycleTheme() {
            socket.emit('action_cycle_theme');
            if(navigator.vibrate) navigator.vibrate(30);
        }
    </script>
</body>
</html>
